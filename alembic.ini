[alembic]
script_location = alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# sqlalchemy.url 은 여기 두지 않는다. env.py 가 CLASSFIT_DATABASE_URL 하나만 읽고 폴백이 없다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
