[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classfit"
version = "0.1.0"
description = "BCTONE 강사관리 플랫폼 백엔드 (패키지명 classfit 은 임시)"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.setuptools.packages.find]
where = ["src"]

# ───────── ruff: 기본값 + 금지 import(TID251). 기획·시안 HTML 폴더와 OKF 도구 사본(BHQ 원본 그대로, sha 대조)만 제외
[tool.ruff]
extend-exclude = ["기획", "시안", "scripts/okf"]
# 경로를 직접 줘도 제외를 지킨다(`ruff check scripts/okf` · format-on-edit 훅이 okf.py 사본을 고치지 않게, T0b 리뷰)
force-exclude = true

# 포매터는 .py 만 — 루트 참조 가이드 md 의 코드 블록은 원문 그대로 둔다(T11 결정 xiii)
[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["TID251"]

# 금지 의존성·동기 세션은 grep 이 아니라 AST 로 막는다 (여러 줄 import 도 잡힌다)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncpg".msg = "드라이버는 psycopg 하나"
"psycopg2".msg = "드라이버는 psycopg 3 하나"
"openai".msg = "OpenAI 호환 API 는 httpx 로 직접 부른다"
"langchain".msg = "LangChain 금지 (langgraph 만, 이행 의존성 langchain-core 는 허용)"
# ruff 는 모듈 단위라 langchain_* 접두를 못 막는다 — 알려진 통합 패키지는 여기, 목록 밖 langchain_* 는 gate.sh grep 이 잡는다
"langchain_openai".msg = "LangChain 통합 패키지 금지 — OpenAI 호환 API 는 httpx 로 직접"
"langchain_community".msg = "LangChain 통합 패키지 금지 (langchain-core 만 허용)"
"langchain_anthropic".msg = "LangChain 통합 패키지 금지 (langchain-core 만 허용)"
"langchain_google_genai".msg = "LangChain 통합 패키지 금지 (langchain-core 만 허용)"
"langchain_text_splitters".msg = "LangChain 통합 패키지 금지 (langchain-core 만 허용)"
"langchain_experimental".msg = "LangChain 통합 패키지 금지 (langchain-core 만 허용)"
"sqlalchemy.orm.Session".msg = "동기 세션 금지 — AsyncSession"
"sqlalchemy.orm.sessionmaker".msg = "동기 세션 금지 — async_sessionmaker"
"sqlalchemy.create_engine".msg = "동기 엔진 금지 — create_async_engine"

[tool.ruff.lint.isort]
# 저장소에 alembic/ 폴더가 있어 1st-party 로 오인한다
known-third-party = ["alembic"]

# ───────── pytest
[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# ───────── import-linter: 경계는 기계가 지킨다
[tool.importlinter]
root_package = "classfit"

# ① 종류 계층. 위층은 아래층을 부를 수 있고, 아래층은 위층을 모른다.
#    같은 줄의 `|` 는 서로 독립(서로 import 하지 않음).
[[tool.importlinter.contracts]]
name = "1. 종류 계층 (main > app > service > crud > schemas > models|database > core)"
# exhaustive: 새 최상위 모듈(worker·mcp·cli …)은 여기 더하기 전엔 lint-imports 가 막는다
type = "layers"
containers = ["classfit"]
exhaustive = true
layers = [
  "main",
  "app",
  "service",
  "crud",
  "schemas",
  "models | database",
  "core",
]

# ② service 구성요소: rules(순수 함수)가 맨 아래, 그 위 auth·courses·diagnosis·enroll·files·home·inquiries·instructors·pool·surveys 는 서로 모른다(Design 5절 14).
#    구성요소 사이의 읽기는 crud 를 거친다. exhaustive 라 새 구성요소 폴더는 여기 더하기 전엔 lint-imports 가 막는다.
#    rules 가 crud·models 를 부르지 않는 것은 이 계약이 아니라 tests/unit/test_import_rules.py 가 본다(T2a 결정 iv).
[[tool.importlinter.contracts]]
name = "2. service 구성요소: rules 가 맨 아래, 나머지는 서로 모른다"
type = "layers"
containers = ["classfit.service"]
exhaustive = true
layers = [
  "auth | courses | diagnosis | enroll | files | home | inquiries | instructors | pool | surveys",
  "rules",
]

# ③ 코어 집합은 소비자(app·main, 나중에 mcp·cli·worker)를 import 하지 않는다.
#    새 소비자 모듈을 만들면 forbidden_modules 에 같이 더한다.
[[tool.importlinter.contracts]]
name = "3. 코어 집합은 소비자를 모른다"
type = "forbidden"
source_modules = [
  "classfit.core",
  "classfit.database",
  "classfit.models",
  "classfit.schemas",
  "classfit.crud",
]
forbidden_modules = ["classfit.app", "classfit.main"]
